# Same Blueprint as soccer-under-strategy / moon-scanner / pro-trader (Rawlincoln Render account).
# Connect at https://dashboard.render.com/blueprints/new?repo=https://github.com/Rawlincoln/ci-avs
# Every push to main auto-deploys the live site.
services:
  - type: web
    name: ci-avs
    runtime: node
    plan: free
    repo: https://github.com/Rawlincoln/ci-avs
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NITRO_PRESET
        value: render-com
      - key: VITE_AUTH_ENABLED
        value: "false"
