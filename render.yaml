services:
  - type: web
    name: ci-avs
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NITRO_PRESET
        value: render-com
      - key: NODE_VERSION
        value: "22"
      - key: VITE_AUTH_ENABLED
        value: "false"
